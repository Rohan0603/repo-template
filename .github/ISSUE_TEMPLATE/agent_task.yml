name: Agent work item
# Install labels chief, worker and human before enabling this form.
# Do not specify projects here: GitHub Project auto-add + verification is the default.
description: Create a tracked Chief-owned task that can later be certified for Worker.
title: "[TASK] "
labels:
  - chief
body:
  - type: markdown
    attributes:
      value: >
        All tasks must be added to the authorized GitHub Project. Chief certifies
        Definition of Ready before changing the route to worker. Never use
        both chief and worker; human is optional only when chief is present.
  - type: textarea
    id: outcome
    attributes:
      label: Outcome and why
      description: A single measurable outcome and expected behavior/user impact.
      placeholder: What will exist or behave differently after acceptance?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and exclusions
      description: Include affected components and explicit non-goals.
    validations:
      required: true
  - type: textarea
    id: baseline
    attributes:
      label: Verified baseline
      description: Repository, branch, examined commit SHA, relevant files, APIs and versions.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and blockers
      description: Add native GitHub blocking/sub-issue relations after creation.
      value: "- Dependencies: none known (verify)\n- Human-only gate: none known (verify)"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Evidence and decision context
      description: Official sources with versions/dates, approved ADR references, constraints and assumptions.
    validations:
      required: true
  - type: textarea
    id: implementation
    attributes:
      label: Detailed implementation or research recipe
      description: Enough specifics for an independent smaller Worker model to act without chat history.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Verifiable acceptance criteria
      value: |
        - [ ] Given ... When ... Then ...
        - [ ] Negative/failure case verified
        - [ ] Regression test verifies unchanged behavior
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Exact verification/evidence plan
      value: |
        - Command, environment, expected result:
        - CI workflow/check:
        - Evidence artifact/URL:
        - NOT RUN conditions:
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risk, security, rollback and approvals
      value: |
        - Risk: Normal / Elevated / Critical
        - Security/privacy/licensing/consent:
        - Owner approval required? (why):
        - Rollback/revert:
    validations:
      required: true
  - type: checkboxes
    id: governance
    attributes:
      label: Initial governance acknowledgement
      options:
        - label: I checked for duplicate issues and will add this issue to the correct GitHub Project.
          required: true
        - label: This issue starts Chief-owned; Chief will verify Definition of Ready before Worker routing.
          required: true
